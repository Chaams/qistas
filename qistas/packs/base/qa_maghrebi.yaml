- id: magh-006
  turns:
    - user: "شريت تيكي طيارة تونس-باريس"
    - user: "نجم نبدل التاريخ؟ وقداش يكلفني؟"
  expected_dialect: maghrebi
  context:
    - "يمكن تغيير تاريخ الرحلة حتى 24 ساعة قبل الإقلاع مقابل 120 دينارًا، إضافة إلى فارق السعر إن وُجد. تذاكر الفئة «الترويجية» غير قابلة للتغيير."
  reference: "تنجم تبدل التاريخ لين 24 ساعة قبل الطيارة بـ 120 دينار وزيد فرق السوم إذا فما، أما كان التيكي ترويجي ما يتبدلش."
  tags: [travel, tunisian, multi-turn]

- id: magh-007
  turns:
    - user: "قداش راه الأورو اليوم في السكوار؟"
  expected_dialect: maghrebi
  context:
    - "يطبّق البنك سعر الصرف الرسمي المنشور يوميًا من بنك الجزائر على جميع عمليات الصرف في الوكالات."
  reference: "ما عنديش سعر السكوار، البنك يخدم غير بالسعر الرسمي اللي ينشرو بنك الجزائر كل يوم."
  tags: [banking, exchange, algerian, unanswerable]

- id: magh-008
