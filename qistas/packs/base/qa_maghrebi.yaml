  expected_dialect: maghrebi
  context:
    - "يمكن تتبع الطلب من «طلباتي» باستعمال رقم التتبع. مدة التوصيل العادية من 2 إلى 4 أيام عمل داخل المدن الكبرى، ومن 5 إلى 7 أيام في باقي المناطق."
  reference: "تقدر تتبع الكوموند من «طلباتي» برقم التتبع، والتوصيل عادة من 2 حتى 4 أيام فالمدن الكبار ومن 5 حتى 7 فالمناطق الأخرى."
  tags: [ecommerce, moroccan, complaint]

