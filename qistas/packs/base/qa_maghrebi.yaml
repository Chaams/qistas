# Pack de base Qistas — questions-réponses en dialectes maghrébins (tunisien, marocain, algérien)
# Les tags tunisian / moroccan / algerian précisent la variante. Le mélange avec le français est normal ici.
# Cas 001-002 : modèles. Cas 003-009 : brouillons à relire par Chamseddine.

- id: magh-001
  turns:
    - user: "نحب نعرف قداش معاليم التحويل للخارج"
  expected_dialect: maghrebi
  context:
    - "تبلغ معاليم التحويل إلى الخارج 15 دينارًا لكل عملية، إضافة إلى 0.5% من المبلغ المحوَّل."
  reference: "معاليم التحويل للخارج 15 دينار على كل عملية، وزيد عليهم 0.5% من المبلغ اللي تحوّلو."
  tags: [banking, fees, tunisian]

- id: magh-002
  turns:
    - user: "بغيت نبدل الباقة ديالي، كيفاش ندير؟"
  expected_dialect: maghrebi
  context:
    - "لتغيير الباقة، اطلب الرمز *3# أو استعمل التطبيق. تبدأ الباقة الجديدة فورًا، ويُحتسب الفرق في الفاتورة القادمة."
  reference: "دير *3# ولا بدلها من التطبيق، والباقة الجديدة كتبدا دغيا والفرق كيتحسب ليك فالفاتورة الجاية."
  tags: [telecom, moroccan]

- id: magh-003
  turns:
    - user: "واش يلزم باش نحل كونط فالبنكة؟"
  expected_dialect: maghrebi
  context:
    - "لفتح حساب جارٍ يلزم: بطاقة التعريف الوطنية، وشهادة الإقامة، وكشف الراتب أو ما يثبت الدخل. الحد الأدنى للإيداع الأول 5,000 دينار."
  reference: "يلزمك بطاقة التعريف، شهادة الإقامة، وكشف الراتب ولا حاجة تثبت الدخل، وأول إيداع على الأقل 5,000 دينار."
  tags: [banking, account, algerian, code-switching]

- id: magh-004
  turns:
    - user: "الكونيكسيون مقصوصة عندي من الصباح، شنوة نعمل؟"
  expected_dialect: maghrebi
  context:
    - "في حالة انقطاع الإنترنت: تأكد من رصيدك ومن صلاحية الباقة، ثم أعد تشغيل المودم. إذا تواصل الانقطاع، اتصل بالرقم 1298 لتسجيل عطب فني يُعالَج خلال 48 ساعة."
  reference: "ثبّت في الرصيد وفي صلوحية الباقة، وطفي المودام وشعلو، وإذا مازالت مقصوصة كلم 1298 يسجلولك عطب ويصلحوه في 48 ساعة."
  tags: [telecom, troubleshooting, tunisian, code-switching]

- id: magh-005
  turns:
    - user: "شحال كتاخد البطاقة الوطنية باش توجد؟"
  expected_dialect: maghrebi
  context:
    - "تُسلَّم البطاقة الوطنية الإلكترونية في أجل أقصاه 30 يومًا من تاريخ إيداع الطلب، ويُرسَل إشعار برسالة نصية عند جاهزيتها."
  reference: "كتوجد فـ 30 يوم على الأكثر من نهار حطيتي الطلب، وغادي توصلك ميساج ملي تكون واجدة."
