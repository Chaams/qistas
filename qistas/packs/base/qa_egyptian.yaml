# Pack de base Qistas — questions-réponses en dialecte égyptien
# L'utilisateur écrit en égyptien, les documents sont en MSA : le bot doit répondre en égyptien.
# Cas 001-002 : modèles. Cas 003-009 : brouillons à relire par Chamseddine.

- id: egy-001
  turns:
    - user: "عايز أعرف إزاي أشحن رصيد من الأبلكيشن"
  expected_dialect: egyptian
  context:
    - "لشحن الرصيد من التطبيق: اختر «شحن الرصيد»، ثم أدخل المبلغ، وادفع بالبطاقة البنكية أو المحفظة الإلكترونية. الحد الأدنى للشحن 10 جنيهات."
  reference: "ادخل على «شحن الرصيد» في الأبلكيشن، اكتب المبلغ وادفع بالفيزا أو المحفظة، وأقل شحنة 10 جنيه."
  tags: [telecom, top-up]

- id: egy-002
  turns:
    - user: "النت بتاعي بطيء أوي من امبارح، أعمل إيه؟"
  expected_dialect: egyptian
  context:
    - "إذا كانت سرعة الإنترنت المنزلي بطيئة: أعد تشغيل الراوتر، وتأكد من رصيد الباقة عبر التطبيق. إذا استمرت المشكلة فاتصل على 111 لفتح شكوى فنية، ويتم الرد خلال 24 ساعة."
  reference: "اعمل ريستارت للراوتر وشوف رصيد الباقة من الأبلكيشن، ولو المشكلة فضلت كلم 111 يفتحولك شكوى وهيردوا عليك خلال 24 ساعة."
  tags: [telecom, troubleshooting]

