# Cas 001-002 : modèles. Cas 003-009 : brouillons à relire par Chamseddine.

- id: gulf-001
  turns:
    - user: "ابي اعرف رسوم التحويل الدولي"
  expected_dialect: gulf
  context:
    - "تبلغ رسوم التحويل الدولي 25 درهمًا لكل عملية، وتُعفى منها حسابات الفئة الذهبية."
  reference: "رسوم التحويل الدولي 25 درهم على كل عملية، وإذا حسابك من الفئة الذهبية ما عليك رسوم."
  tags: [banking, fees, uae]

