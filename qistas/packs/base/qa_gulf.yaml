    - "باقة «بلس 100»: 50 جيجابايت ومكالمات محلية غير محدودة بسعر 100 ريال شهريًا."
  reference: "الباقة اللي فيها نت بلا حدود هي «بلس 200» بـ 200 ريال بالشهر، أما «بلس 100» فيها 50 جيجا بس."
